<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="I&amp;M Bouwwerkers – naadloze PMMA-, epoxy- en PU-coatings en troffelvloeren voor balkons, galerijen, garages en bedrijfshallen in heel Nederland.">
<meta name="theme-color" content="#0a0c0e">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>I&amp;M Bouwwerkers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one continuous graphite ground (deliberately dark-only, like fresh resin), floating glass navigation, rounded bento surfaces, logo-blue accent (I&M Bouwwerkers). */
:root{
  --bg:#0a0c0e; --bg-2:#111417; --glass:rgba(255,255,255,.04); --glass-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --fg:#f3f2ef; --muted:#9aa0a5; --dim:#62686d;
  --gold:#5fb0f0; --gold-2:#1f78c8; --gold-ink:#04121f;
  --grad:linear-gradient(135deg,#cfe8ff 0%,#3d9be6 45%,#145a9c 100%);
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Geist","Helvetica Neue",Arial,sans-serif;
  --f-m:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px); --max:1280px; --r:28px; --r-s:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--gold);color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

/* ambient light + grain, shared by every section so transitions stay seamless */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vw 50vh at 85% 8%,rgba(61,155,230,.10),transparent 60%),
  radial-gradient(50vw 60vh at 0% 60%,rgba(120,140,160,.08),transparent 60%),
  radial-gradient(40vw 40vh at 70% 100%,rgba(61,155,230,.06),transparent 60%),var(--bg)}
.grain{position:fixed;inset:-50%;z-index:100;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
section{padding-block:clamp(72px,10vw,140px)}
h1,h2,h3,h4{margin:0;font-family:var(--f-d);font-weight:500;text-wrap:balance;letter-spacing:-.035em}
h1{font-size:clamp(2.6rem,7.4vw,7.2rem);line-height:.95;font-weight:500}
h2{font-size:clamp(2rem,4.6vw,4.1rem);line-height:1.02}
h3{font-size:clamp(1.15rem,1.7vw,1.45rem);line-height:1.15;letter-spacing:-.02em}
p{margin:0;max-width:64ch}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(1.05rem,1.35vw,1.22rem);color:var(--muted);line-height:1.6;font-weight:300}
.muted{color:var(--muted)}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kicker{display:inline-flex;align-self:flex-start;align-items:center;gap:9px;padding:7px 14px 7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font:500 .7rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(95,176,240,.15),0 0 14px var(--gold)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;padding:8px 8px 8px 22px;min-height:52px;border-radius:999px;font:500 .95rem/1 var(--f-b);text-decoration:none;border:1px solid transparent;cursor:pointer;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s;white-space:nowrap}
.btn .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .ic{transform:rotate(-45deg)}
.btn-gold{background:var(--grad);color:var(--gold-ink);box-shadow:0 12px 34px -12px rgba(61,155,230,.7),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-gold .ic{background:var(--gold-ink);color:var(--gold)}
.btn-gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s}
.btn-gold:hover::after{transform:translateX(120%)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 18px 44px -12px rgba(61,155,230,.85),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-glass{background:var(--glass-2);border-color:var(--line-2);color:var(--fg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn-glass .ic{background:rgba(255,255,255,.1)}
.btn-glass:hover{background:rgba(255,255,255,.12)}
.btn.sm{min-height:44px;padding:5px 5px 5px 18px;font-size:.88rem}
.btn.sm .ic{width:32px;height:32px}
.btn.plain{padding:0 22px}

/* nav */
.nav-shell{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;z-index:60;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:1320px;display:flex;align-items:center;gap:14px;padding:7px 7px 7px 16px;border-radius:999px;background:rgba(14,16,19,.58);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);box-shadow:0 18px 50px -18px rgba(0,0,0,.7);transition:background .4s}
.scrolled .nav-in{background:rgba(12,14,16,.82)}
.logo{display:flex;align-items:center;flex-shrink:0}
.logo img{height:40px;width:auto}
.nav{display:flex;gap:2px;margin-inline:auto;align-items:center}
.nav>a,.dd>button{font:450 .9rem/1 var(--f-b);text-decoration:none;padding:11px 14px;border-radius:999px;background:none;border:0;color:rgba(243,242,239,.8);cursor:pointer;display:flex;gap:6px;align-items:center;transition:background .25s,color .25s}
.nav>a:hover,.dd>button:hover,.dd>button[aria-expanded="true"]{background:var(--glass-2);color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--glass-2)}
.dd{position:relative}
.mega{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);width:min(860px,92vw);padding:14px;border-radius:24px;background:rgba(16,18,21,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);display:grid;grid-template-columns:1fr 1.15fr;gap:14px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateX(-50%) translateY(-6px) scale(.98)}to{transform:translateX(-50%)}}
.mega h5{margin:6px 8px 10px;font:500 .66rem/1 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mega .sysl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mega .sysl a{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-decoration:none;transition:border-color .25s,background .25s}
.mega .sysl a:hover{border-color:rgba(95,176,240,.4);background:rgba(95,176,240,.06)}
.mega .sysl b{font:600 1.1rem/1 var(--f-d)}
.mega .sysl span{font-size:.78rem;color:var(--muted);line-height:1.3}
.mega .appl a{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:8px;border-radius:16px;text-decoration:none;transition:background .25s}
.mega .appl a:hover{background:var(--glass-2)}
.mega .appl img{width:76px;height:56px;object-fit:cover;border-radius:12px}
.mega .appl b{display:block;font-weight:500;font-size:.95rem}
.mega .appl span{font-size:.78rem;color:var(--muted)}
.mega .all{display:block;margin:8px;font-size:.85rem;color:var(--gold);text-decoration:none}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.lang button{font:500 .7rem/1 var(--f-m);letter-spacing:.06em;padding:9px 10px;border-radius:999px;background:none;border:0;color:var(--muted);cursor:pointer;transition:all .25s}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass-2);color:var(--fg);cursor:pointer;place-items:center}
.mnav{position:fixed;inset:0;z-index:55;background:rgba(9,10,12,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(env(safe-area-inset-top,0px) + 92px) var(--gut) 40px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.mnav a{font:500 1.6rem/1.15 var(--f-d);letter-spacing:-.03em;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)}
.mnav a.sub{font:400 1rem/1 var(--f-b);letter-spacing:0;padding:11px 0 11px 18px;color:var(--muted)}
.mnav .btn{margin-top:22px;align-self:flex-start;font:500 .95rem/1 var(--f-b);border:0;padding:8px 8px 8px 22px}
@media (max-width:1140px){.nav,.tools .btn{display:none}.burger{display:grid}.tools{margin-left:auto}}

/* hero */
.hero{position:relative;min-height:min(96svh,920px);display:flex;align-items:flex-end;padding:150px 0 44px;overflow:hidden;isolation:isolate}
.hero-3d,.hero-fallback{position:absolute;inset:0;z-index:-2}
.hero-fallback{background-size:cover;background-position:center;filter:saturate(.7) brightness(.6)}

.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(10,12,14,.92) 0%,rgba(10,12,14,.55) 40%,rgba(10,12,14,0) 70%),linear-gradient(0deg,var(--bg) 0%,rgba(10,12,14,0) 35%),linear-gradient(180deg,rgba(10,12,14,.7) 0%,rgba(10,12,14,0) 22%)}
.hero .wrap{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end}
.hero-copy{display:flex;flex-direction:column;gap:28px;min-width:0}
.hero h1{max-width:11ch}
.hero .lead{max-width:44ch;color:rgba(243,242,239,.72)}
.phase{width:300px;padding:18px;border-radius:22px;background:rgba(14,16,19,.5);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:14px}
.phase-top{display:flex;justify-content:space-between;align-items:center;font:500 .66rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.live{display:flex;gap:7px;align-items:center;color:var(--gold)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.phase ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.phase li{display:flex;justify-content:space-between;font-size:.88rem;color:var(--dim);transition:color .4s}
.phase li span{font:400 .72rem/1.6 var(--f-m)}
.phase li.on{color:var(--fg)}
.phase li.done{color:var(--muted)}
.bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad)}
.scrollhint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:22px;height:34px;border:1px solid var(--line-2);border-radius:12px}
.scrollhint::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:sh 1.8s infinite}
@keyframes sh{0%{transform:translateY(0)}60%{transform:translateY(10px);opacity:0}100%{opacity:0}}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.phase{width:100%}.scrollhint{display:none}
 .hero::before{background:linear-gradient(0deg,var(--bg) 0%,rgba(10,12,14,.85) 38%,rgba(10,12,14,0) 60%)}}

/* hero scene */
.hero-3d{overflow:hidden}
.hs{position:absolute;inset:0;perspective:2200px;perspective-origin:68% 28%}
.hs-stage{--sw:min(35vw,580px);--sd:calc(var(--sw) * .64);--th:clamp(48px,6vw,84px);position:absolute;right:max(5vw,40px);top:54%;width:var(--sw);height:var(--sd);margin-top:calc(var(--sd) / -2);transform-style:preserve-3d;transform:rotateX(calc(60deg + var(--rx,0deg))) rotateZ(calc(-32deg + var(--rz,0deg)));transition:transform .8s ease-out}
.hs-shadow{position:absolute;inset:-14%;background:radial-gradient(closest-side,rgba(0,0,0,.85),transparent);filter:blur(16px)}
.hs-slab{position:absolute;inset:0;transform-style:preserve-3d}
.hs-f{position:absolute;background-size:100% 100%}
.hs-top{inset:0;transform:translateZ(var(--th))}
.hs-fr{left:0;bottom:0;width:100%;height:var(--th);transform-origin:50% 100%;transform:rotateX(-90deg);filter:brightness(.8)}
.hs-lf{left:0;top:0;width:var(--sd);height:var(--th);transform-origin:0 0;transform:rotateZ(90deg) rotateX(90deg);filter:brightness(.56)}
.hs-cfr{position:absolute;left:0;top:0;width:100%;height:5px;background:linear-gradient(#d2d5d6,#9fa3a6)}
.hs-clf{position:absolute;left:0;bottom:0;width:100%;height:5px;background:linear-gradient(0deg,#d2d5d6,#9fa3a6)}
.hs-coatplane{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(calc(var(--th) + 1.5px))}
.hs-coat{position:absolute;inset:0;filter:drop-shadow(-1px -1px 0 rgba(255,255,255,.5)) drop-shadow(2px 3px 2px rgba(0,0,0,.55))}
.hs-fill{position:absolute;inset:0;background-size:100% 100%;-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
.hs-fill::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 45% at 30% 38%,rgba(255,255,255,.42),transparent 70%),radial-gradient(30% 25% at 70% 70%,rgba(255,255,255,.12),transparent 70%);opacity:calc(.35 + var(--wet,1) * .65)}
.hs-flakes{position:absolute;inset:0;background-size:100% 100%;opacity:0}
.hs-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);background-size:300% 100%;background-position:var(--gp,130%) 0;opacity:0}
.hs-wave{position:absolute;top:2%;bottom:2%;width:2.6%;margin-left:16px;border-radius:50%/8%;background:linear-gradient(90deg,rgba(160,164,167,.95),rgba(255,255,255,.7) 35%,rgba(150,154,157,.95) 60%,rgba(120,124,127,0));filter:drop-shadow(2px 2px 2px rgba(0,0,0,.4));opacity:0;transform:translateZ(1px)}
.hs-ripple{position:absolute;left:27%;top:47%;width:70px;height:70px;margin:-35px;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:rip 1.3s linear infinite;visibility:hidden}
.hs-ripple.d2{animation-delay:.65s}
@keyframes rip{from{transform:translateZ(2px) scale(.15);opacity:1}to{transform:translateZ(2px) scale(2.6);opacity:0}}
.hs-mk{position:absolute;left:27%;top:47%;width:1px;height:1px}
.hs-drops{position:absolute;inset:0;transform-style:preserve-3d}
.hs-drops span{position:absolute;width:5px;height:3px;border-radius:1px;background:#f3f2ed;animation:fall 1s cubic-bezier(.55,0,1,.6) both}
.hs-drops span:nth-child(3n){background:#17181a}.hs-drops span:nth-child(4n){background:#7b7e81;width:4px}
@keyframes fall{from{transform:translateZ(300px) rotate(0);opacity:0}12%{opacity:1}to{transform:translateZ(1px) rotate(220deg);opacity:1}}
.hs-sq{--sql:calc(var(--sd) * .96);position:absolute;top:2%;width:18px;height:96%;transform-style:preserve-3d;opacity:0}
.sq-f{position:absolute}
.sq-top{inset:0;transform:translateZ(26px);background:linear-gradient(90deg,#8d6a35,#c6e3fd 45%,#1a64a8)}
.sq-lf{left:0;top:0;width:var(--sql);height:26px;transform-origin:0 0;transform:rotateZ(90deg) rotateX(90deg);background:linear-gradient(180deg,#0d0e0f 0 46%,#2b2d2f 46% 50%,#2a7fc8 50%,#cfe8ff 74%,#8f6c35);filter:brightness(.75)}
.sq-fr{left:0;bottom:0;width:100%;height:26px;transform-origin:50% 100%;transform:rotateX(-90deg);background:linear-gradient(0deg,#0d0e0f 0 46%,#2a7fc8 50%,#cfe8ff 74%,#8f6c35)}
.sq-pole{position:absolute;left:5px;top:calc(50% - 460px);width:9px;height:460px;background-size:100% 100%;transform-origin:50% 100%;transform:translateZ(26px) rotateY(-42deg) rotateX(-90deg)}
.hs-bucket{position:absolute;left:0;top:0;width:340px;height:340px;max-width:none;pointer-events:none;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));opacity:0}
.hs-stream{position:absolute;width:0;pointer-events:none;opacity:0}
.hs-stream i{position:absolute;left:calc(var(--sw,8px) / -2);top:0;bottom:-2px;width:var(--sw,8px);border-radius:0 0 50% 50%/0 0 10px 10px;background:linear-gradient(90deg,#7f8386,#c9cdcf 32%,#fff 44%,#b2b6b8 62%,#787c7f);box-shadow:0 0 10px rgba(255,255,255,.18);animation:wob .32s ease-in-out infinite alternate}
@keyframes wob{to{transform:scaleX(.8) translateX(1px)}}
@media (max-width:900px){.hs{perspective-origin:50% 20%}.hs-stage{--sw:min(78vw,520px);right:auto;left:50%;margin-left:calc(var(--sw) / -2);top:calc(185px + 24vw)}.hero{padding-top:calc(185px + 66vw)}}
/* grinder */
.hs-oldp{position:absolute;inset:0;transform:translateZ(calc(var(--th) + .8px))}
.hs-old{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs-gplane{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(calc(var(--th) + 2px))}
.hs-gr{position:absolute;width:22%;aspect-ratio:1;transform-style:preserve-3d;visibility:hidden}
.g-ring{position:absolute;inset:-2%;border-radius:50%;background:radial-gradient(circle,#2a2c2f 60%,#121314 71%);transform:translateZ(calc(var(--i) * 3px));box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.g-ring:first-child{inset:-5%;background:#0b0b0c}
.g-top{position:absolute;inset:0;border-radius:50%;background-size:100% 100%;transform:translateZ(24px);overflow:hidden}
.g-spin{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.22) 80%,transparent 90%);opacity:0}
.run .g-spin{opacity:1;animation:gspin .35s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
.g-mot{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,#2f8ad6,#6d4d20);transform:translateZ(calc(26px + var(--i) * 6px))}
.g-mtop{position:absolute;inset:30%;border-radius:50%;background-size:100% 100%;transform:translateZ(62px)}
.g-pole{position:absolute;top:50%;width:7px;height:330px;margin-top:-330px;background-size:100% 100%;transform-origin:50% 100%;transform:translateZ(40px) rotateX(-128deg)}
.g-pole.a{left:34%}.g-pole.b{left:62%}
.hs-dust{position:absolute;inset:0;transform-style:preserve-3d}
.hs-dust .puff{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(circle,rgba(225,224,218,.55),rgba(225,224,218,0) 70%);animation:puff 1.2s ease-out forwards}
.hs-dust .chip-o{position:absolute;width:5px;height:4px;border-radius:1px;background:#9aa49d;box-shadow:0 0 0 .5px rgba(0,0,0,.3);animation:chipf .9s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes puff{from{transform:translateZ(4px) scale(.4);opacity:.9}to{transform:translate(var(--dx),var(--dy)) translateZ(70px) scale(2.6);opacity:0}}
@keyframes chipf{0%{transform:translateZ(6px)}50%{transform:translate(calc(var(--dx) * .8),calc(var(--dy) * .8)) translateZ(40px) rotate(180deg)}100%{transform:translate(calc(var(--dx) * 1.4),calc(var(--dy) * 1.4)) translateZ(1px) rotate(320deg);opacity:0}}
.hs-gr{display:none!important}
.gm{position:absolute;width:1px;height:1px}
.hs-grinder{position:absolute;left:0;top:0;width:560px;height:340px;max-width:none;pointer-events:none;opacity:0;filter:drop-shadow(10px 22px 18px rgba(0,0,0,.6))}
.hs-prp{position:absolute;inset:0;transform:translateZ(calc(var(--th) + 1.1px))}
.hs-roller{position:absolute;left:0;top:0;width:560px;height:300px;max-width:none;pointer-events:none;opacity:0;filter:drop-shadow(8px 20px 16px rgba(0,0,0,.55))}
/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:26px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mtrack{display:flex;width:max-content;gap:44px;animation:mq 42s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.mtrack span{font:500 clamp(1.8rem,4vw,3.4rem)/1 var(--f-d);letter-spacing:-.03em;white-space:nowrap;display:flex;align-items:center;gap:44px}
.mtrack span:nth-child(even){color:transparent;-webkit-text-stroke:1px rgba(243,242,239,.4)}
.mtrack span::after{content:"✦";font-size:.5em;color:var(--gold);-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* statement + stats */
.statement{font:300 clamp(1.5rem,3.3vw,2.9rem)/1.22 var(--f-b);letter-spacing:-.02em;max-width:30ch;text-wrap:balance}
.statement b{font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(40px,6vw,72px)}
.stat{padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.stat b{font:500 clamp(2.2rem,4vw,3.4rem)/1 var(--f-d);letter-spacing:-.04em}
.stat span{color:var(--muted);font-size:.92rem;line-height:1.4}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}}

.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,64px)}
.shead .stack{max-width:760px}
.shead>p{max-width:42ch}

/* spotlight cards */
.spot{position:relative;overflow:hidden;isolation:isolate}
.spot::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(95,176,240,.14),transparent 45%)}
.spot:hover::after{opacity:1}

/* bento systems */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.bcard{grid-column:span 6;min-height:440px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-2);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;padding:26px;color:var(--fg)}
.bcard:nth-child(1),.bcard:nth-child(4){grid-column:span 7}
.bcard:nth-child(2),.bcard:nth-child(3){grid-column:span 5}
.bcard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter .6s;filter:saturate(.75) brightness(.8)}
.bcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,14,.15) 0%,rgba(10,12,14,.35) 40%,rgba(10,12,14,.94) 100%)}
.bcard:hover>img{transform:scale(1.06);filter:saturate(.9) brightness(.9)}
.btop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(10,12,14,.5);border:1px solid var(--line-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 .72rem/1 var(--f-m);letter-spacing:.04em;color:var(--fg);white-space:nowrap}
.arrow{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .45s cubic-bezier(.2,.8,.2,1)}
a:hover>.btop .arrow,a:hover .arrow{background:var(--gold);color:var(--gold-ink);transform:rotate(-45deg);border-color:transparent}
.bbot{display:flex;flex-direction:column;gap:14px}
.bcode{font:600 clamp(3rem,6vw,5.4rem)/.9 var(--f-d);letter-spacing:-.05em}
.bcard p{color:rgba(243,242,239,.72);font-size:.96rem;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{white-space:normal;line-height:1.3}
@media (max-width:900px){.bcard,.bcard:nth-child(n){grid-column:span 12;min-height:380px}}

/* layers iso */
.layers{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(30px,5vw,80px);align-items:center}
@media (max-width:900px){.layers{grid-template-columns:1fr}}
.seg{display:inline-flex;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);align-self:flex-start;gap:2px}
.seg button{font:500 .8rem/1 var(--f-m);padding:11px 16px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:all .3s}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.isobox{position:relative;border-radius:var(--r);border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,rgba(95,176,240,.08),transparent 60%),var(--glass);padding:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;min-height:460px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.legend li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);animation:fadeL .5s both;animation-delay:calc(var(--i) * 70ms)}
@keyframes fadeL{from{transform:translateX(10px)}}
.legend i{width:14px;height:14px;border-radius:4px;margin-top:3px;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.legend b{font-weight:500;font-size:.9rem;display:block;line-height:1.3}
.legend span{font:400 .74rem/1.4 var(--f-m);color:var(--gold)}
.isonote{grid-column:1/-1;font:400 .7rem/1.4 var(--f-m);color:var(--dim)}

/* expanding panels */
.panels{display:flex;gap:14px;height:600px}
.pan{position:relative;flex:1;min-width:0;border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--fg);border:1px solid var(--line);transition:flex .8s cubic-bezier(.2,.8,.2,1);isolation:isolate}
.panels:hover .pan{flex:.8}.panels .pan:hover{flex:1.9}
.pan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s cubic-bezier(.2,.8,.2,1);filter:saturate(.75)}
.pan:hover img{transform:scale(1.05)}
.pan::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,14,.2),rgba(10,12,14,.25) 40%,rgba(10,12,14,.95))}
.pan-in{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.pan-num{font:500 .74rem/1 var(--f-m);color:var(--gold);letter-spacing:.14em}
.pan h3{font-size:clamp(1.3rem,2vw,1.9rem);max-width:16ch}
.pan p{color:rgba(243,242,239,.72);font-size:.95rem;max-width:40ch}
.pan .bbot{gap:12px}
@media (max-width:900px){.panels{flex-direction:column;height:auto}.pan{min-height:380px;flex:none!important}}

/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,6vw,96px)}
.tl-head{position:sticky;top:120px;align-self:start}
.tl-list{display:flex;flex-direction:column;gap:14px;position:relative}
.tstep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);transition:border-color .4s,background .4s}
.tstep:hover{border-color:rgba(95,176,240,.35);background:rgba(95,176,240,.04)}
.tnum{font:500 2.6rem/1 var(--f-d);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(95,176,240,.7);min-width:2.2ch}
.tstep .stack{gap:10px}
.tstep p{color:var(--muted);font-size:.96rem}
@media (max-width:900px){.tl{grid-template-columns:1fr}.tl-head{position:static}}
.hsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.hsteps .tstep{grid-template-columns:1fr;gap:16px;padding:22px}
.hsteps .tnum{font-size:2rem}
@media (max-width:1000px){.hsteps{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.hsteps{grid-template-columns:1fr}}

/* gallery */
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:220px;gap:14px;grid-auto-flow:dense}
.mosaic figure:nth-child(6){grid-column:span 2}
.mosaic figure{margin:0;position:relative;border-radius:22px;overflow:hidden;cursor:zoom-in;border:1px solid var(--line);background:var(--bg-2)}
.mosaic figure:nth-child(1){grid-column:span 2;grid-row:span 2}
.mosaic figure:nth-child(4){grid-row:span 2}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mosaic figure:hover img{transform:scale(1.05)}
.mosaic figcaption{position:absolute;inset:auto 10px 10px 10px;padding:12px 14px;border-radius:14px;background:rgba(10,12,14,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:.84rem;display:flex;flex-direction:column;gap:4px;transform:translateY(6px);opacity:.92;transition:all .4s}
.mosaic figure:hover figcaption{transform:none;opacity:1}
.mosaic figcaption small{font:500 .62rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@media (max-width:860px){.mosaic{grid-template-columns:1fr 1fr;grid-auto-rows:200px}.mosaic figure:nth-child(1),.mosaic figure:nth-child(6){grid-column:span 2}.mosaic figure:nth-child(7){display:none}}
.mason{columns:3 300px;column-gap:14px}
.mason figure{margin:0 0 14px;break-inside:avoid;position:relative;border-radius:22px;overflow:hidden;cursor:zoom-in;border:1px solid var(--line)}
.mason img{width:100%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mason figure:hover img{transform:scale(1.04)}
.mason figcaption{position:absolute;inset:auto 10px 10px 10px;padding:12px 14px;border-radius:14px;background:rgba(10,12,14,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:.84rem;display:flex;flex-direction:column;gap:4px}
.mason figcaption small{font:500 .62rem/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.filters{display:inline-flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);margin-bottom:28px}
.filters button{font:500 .85rem/1 var(--f-b);padding:11px 16px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:all .3s}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lb{position:fixed;inset:0;z-index:120;background:rgba(6,7,8,.94);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px}
.lb img{max-height:84vh;max-width:min(1100px,100%);object-fit:contain;border-radius:18px}
.lb button{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:18px;width:48px;height:48px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line-2);color:#fff;font-size:20px;cursor:pointer}
.lb p{color:var(--muted);margin:14px auto 0;font-size:.9rem;text-align:center}

/* norms ribbon */
.ribbon{display:flex;flex-wrap:wrap;gap:10px}
.ribbon a{display:inline-flex;align-items:center;gap:10px;padding:14px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);text-decoration:none;font:500 .82rem/1 var(--f-m);transition:all .3s}
.ribbon a:hover{border-color:rgba(95,176,240,.45);color:var(--gold)}
.ribbon a span{color:var(--muted);font-family:var(--f-b);font-size:.82rem}

/* CTA */
.cta-card{position:relative;border-radius:36px;overflow:hidden;padding:clamp(32px,6vw,80px);border:1px solid rgba(95,176,240,.25);background:radial-gradient(120% 120% at 100% 0%,rgba(61,155,230,.28),transparent 50%),radial-gradient(80% 100% at 0% 100%,rgba(120,140,160,.14),transparent 55%),var(--bg-2);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:40px;align-items:center;isolation:isolate}
.cta-card::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%)}
.cta-logo{justify-self:end;width:min(100%,320px);filter:drop-shadow(0 30px 50px rgba(0,0,0,.55));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}
@media (max-width:860px){.cta-card{grid-template-columns:1fr}.cta-logo{justify-self:start;width:220px}}

/* subpage hero */
.phero{position:relative;margin:0 12px;border-radius:0 0 36px 36px;overflow:hidden;min-height:min(70svh,640px);display:flex;align-items:flex-end;padding:150px 0 56px;isolation:isolate}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.75);animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,12,14,.9),rgba(10,12,14,.4) 60%,rgba(10,12,14,.15)),linear-gradient(0deg,rgba(10,12,14,.9),transparent 50%)}
.phero .wrap{width:100%;display:flex;flex-direction:column;gap:22px}
.phero h1{font-size:clamp(2.4rem,6vw,5.6rem);max-width:14ch}
.phero .lead{color:rgba(243,242,239,.75);max-width:52ch}
.crumbs{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(10,12,14,.45);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:500 .7rem/1 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crumbs a{text-decoration:none;color:var(--fg)}
@media (max-width:760px){.phero{margin:0;border-radius:0 0 28px 28px}.phero::before{background:linear-gradient(0deg,rgba(10,12,14,.95),rgba(10,12,14,.45))}}

/* generic layout pieces */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,96px);align-items:center}
.split.rev>:first-child{order:2}
@media (max-width:900px){.split{grid-template-columns:1fr}.split.rev>:first-child{order:0}}
.photo{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .chip{position:absolute;left:16px;bottom:16px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,3vw,36px)}
.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec{padding:18px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.spec small{font:500 .66rem/1.3 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec b{font:500 1.02rem/1.25 var(--f-d);letter-spacing:-.02em;overflow-wrap:anywhere}
@media (max-width:480px){.specgrid{grid-template-columns:1fr}}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:.98rem}
.checks li::before{content:"";width:28px;height:28px;border-radius:50%;background:var(--grad);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.checks li{position:relative}
.checks li::after{content:"";position:absolute;left:25px;top:50%;width:8px;height:5px;border-left:2px solid var(--gold-ink);border-bottom:2px solid var(--gold-ink);transform:translateY(-70%) rotate(-45deg)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards3>div{padding:28px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.cards3>div p{color:var(--muted);font-size:.96rem}
.cards3 .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(95,176,240,.1);border:1px solid rgba(95,176,240,.25);color:var(--gold);font:600 .9rem/1 var(--f-m)}
@media (max-width:860px){.cards3{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini a{display:flex;flex-direction:column;gap:18px;padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);text-decoration:none;transition:border-color .3s}
.mini a:hover{border-color:rgba(95,176,240,.4)}
.mini .bcode{font-size:2.8rem}
.mini p{color:var(--muted);font-size:.93rem}
@media (max-width:860px){.mini{grid-template-columns:1fr}}
.recs{display:flex;flex-direction:column;gap:10px}
.recs a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 20px 20px 26px;border-radius:22px;background:var(--glass);border:1px solid var(--line);text-decoration:none;transition:border-color .3s}
.recs a:hover{border-color:rgba(95,176,240,.4)}
.recs .code{font:600 1.7rem/1 var(--f-d);letter-spacing:-.04em}
.recs span{color:var(--muted);font-size:.88rem}

/* table */
.tablecard{border-radius:var(--r);border:1px solid var(--line);background:var(--glass);overflow-x:auto}
.cmp{width:100%;min-width:760px;border-collapse:collapse}
.cmp th,.cmp td{padding:18px 22px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
.cmp thead th{font:600 1.15rem/1 var(--f-d);letter-spacing:-.03em}
.cmp tbody th{font:500 .72rem/1.3 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cmp td{font-family:var(--f-m);font-size:.84rem}
.cmp tbody tr:last-child>*{border-bottom:0}
.cmp tbody tr:hover{background:rgba(255,255,255,.025)}

/* norms */
.norms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.norm{padding:28px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.norm code{align-self:flex-start;padding:7px 12px;border-radius:999px;background:rgba(95,176,240,.1);border:1px solid rgba(95,176,240,.3);color:var(--gold);font:500 .78rem/1 var(--f-m)}
.norm p{color:var(--muted);font-size:.95rem}
@media (max-width:860px){.norms{grid-template-columns:1fr}}
.rscale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rs{padding:22px 18px;border-radius:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;background:var(--glass);position:relative;overflow:hidden}
.rs b{font:600 2rem/1 var(--f-d);letter-spacing:-.04em}
.rs .meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.rs .meter i{display:block;height:100%;background:var(--grad)}
.rs p{color:var(--muted);font-size:.88rem;line-height:1.45}
@media (max-width:900px){.rscale{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.rscale{grid-template-columns:1fr}}

/* faq */
.faq{display:flex;flex-direction:column;gap:10px;max-width:920px}
.faq details{border-radius:22px;background:var(--glass);border:1px solid var(--line);transition:border-color .3s,background .3s}
.faq details[open]{border-color:rgba(95,176,240,.3);background:rgba(95,176,240,.035)}
.faq summary{cursor:pointer;list-style:none;padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;font:500 clamp(1rem,1.5vw,1.15rem)/1.35 var(--f-d);letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex-shrink:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);font:300 1.3rem/1 var(--f-b);color:var(--gold);transition:transform .35s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 26px 26px;color:var(--muted)}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:9px;font:500 .7rem/1 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{font:400 1rem/1.4 var(--f-b);color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--line);padding:16px 18px;border-radius:16px;width:100%;letter-spacing:0;text-transform:none;transition:border-color .25s,box-shadow .25s,background .25s}

.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(var(--gut),calc((100vw - var(--max)) / 2 + var(--gut)));padding-inline:max(var(--gut),calc((100vw - var(--max)) / 2 + var(--gut)));padding-bottom:6px;scrollbar-width:none;cursor:grab}

.pcard{position:relative;flex:0 0 clamp(290px,31vw,430px);aspect-ratio:3/4;border-radius:28px;overflow:hidden;scroll-snap-align:start;border:1px solid var(--line);background:var(--bg-2);isolation:isolate;cursor:zoom-in}

.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(95,176,240,0);transition:box-shadow .4s;pointer-events:none}

.partner{display:flex;flex-direction:column;gap:16px;padding:16px 16px 22px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);transition:border-color .35s,transform .35s}

/* 3D montagestudio – ported from the Betrouw Bouw artifact, scoped to .bb-studio */
.bb-studio {
  --amber: #5fb0f0;
  --amber-hi: #8cc8f5;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .14);
  --muted: #A1A1AA;
  --dim: #71717A;
  --bgc: #070708;
  --ease: cubic-bezier(.22, .8, .2, 1);
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #111113;
  box-shadow: 0 50px 100px -50px rgba(0, 0, 0, .9);
  margin: 0;
}
.bb-studio button { font-family: inherit; }
.bb-studio .st-canvas { position: relative; aspect-ratio: 16/9; max-height: 78vh; width: 100%; background: radial-gradient(ellipse 70% 70% at 50% 38%, #2b2b30 0%, #151517 55%, #0b0b0c 100%); cursor: grab; touch-action: pan-y; overflow: hidden; }
.bb-studio .st-canvas.grabbing { cursor: grabbing; }
.bb-studio .st-canvas canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.bb-studio .st-canvas .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bb-studio .w3d-tags { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.bb-studio .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .35s; white-space: nowrap; will-change: transform; }
.bb-studio .tag.show { opacity: 1; }
.bb-studio .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 5px rgba(95, 176, 240, .22); flex: none; }
.bb-studio .tag em { width: 18px; height: 2px; background: var(--amber); flex: none; }
.bb-studio .tag span { font-weight: 600; font-size: .78rem; background: rgba(10, 10, 11, .88); border: 1px solid rgba(95, 176, 240, .45); color: #fff; padding: 6px 10px; border-radius: 8px; }
.bb-studio .tag.left { flex-direction: row-reverse; }
.bb-studio .st-info { position: absolute; left: 20px; top: 20px; z-index: 3; width: min(380px, calc(100% - 40px)); padding: 18px 20px; border-radius: 18px; background: rgba(12, 12, 13, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .1); display: grid; gap: 8px; }
.bb-studio .st-num { font-weight: 700; font-size: .75rem; letter-spacing: .12em; color: var(--amber); text-transform: uppercase; }
.bb-studio .st-info h3 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.015em; line-height: 1.15; }
.bb-studio .st-info p { color: #D4D4D8; font-size: .92rem; line-height: 1.55; }
.bb-studio .st-info.swap h3, .bb-studio .st-info.swap p { animation: bb-st-up .45s var(--ease) both; }
@keyframes bb-st-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.bb-studio .st-tools { position: absolute; right: 20px; top: 20px; z-index: 3; display: flex; gap: 8px; align-items: center; }
.bb-studio .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(12, 12, 13, .72); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .1); }
.bb-studio .seg button { border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .9rem; padding: 9px 16px; border-radius: 10px; cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
.bb-studio .seg button:hover { color: #fff; }
.bb-studio .seg button[aria-pressed="true"] { background: var(--amber); color: #04121f; }
.bb-studio .st-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(12, 12, 13, .72); backdrop-filter: blur(14px); color: #fff; font-weight: 600; font-size: .9rem; cursor: pointer; transition: border-color .2s, background .2s, color .2s; }
.bb-studio .st-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bb-studio .st-btn:hover { border-color: var(--amber); }
.bb-studio .st-btn[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #04121f; }
.bb-studio .st-view { position: absolute; right: 20px; bottom: 20px; z-index: 3; display: flex; gap: 6px; }
.bb-studio .st-view button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(12, 12, 13, .72); backdrop-filter: blur(14px); color: #fff; display: grid; place-items: center; cursor: pointer; font-weight: 600; font-size: 1.2rem; }
.bb-studio .st-view button:hover { border-color: var(--amber); color: var(--amber); }
.bb-studio .st-view svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bb-studio .st-hint { position: absolute; left: 20px; bottom: 20px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(12, 12, 13, .6); font-size: .8rem; color: #D4D4D8; pointer-events: none; transition: opacity .5s; }
.bb-studio .st-hint svg { width: 16px; height: 16px; stroke: var(--amber); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bb-studio .st-hint.off { opacity: 0; }
.bb-studio .st-rail { display: flex; gap: 12px; align-items: stretch; padding: 14px; border-top: 1px solid var(--line); }
.bb-studio .st-play { flex: none; width: 52px; border-radius: 14px; border: 0; background: var(--amber); color: #04121f; display: grid; place-items: center; cursor: pointer; transition: background .2s; }
.bb-studio .st-play:hover { background: var(--amber-hi); }
.bb-studio .st-play svg { width: 20px; height: 20px; fill: currentColor; }
.bb-studio .st-chapters { list-style: none; margin: 0; padding: 0; flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.bb-studio .st-chapters button { position: relative; width: 100%; height: 100%; min-height: 58px; text-align: left; padding: 10px 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bgc); color: var(--muted); font-weight: 600; font-size: .76rem; line-height: 1.25; cursor: pointer; overflow: hidden; transition: border-color .2s, color .2s, background .2s; }
.bb-studio .st-chapters button b { display: block; font-weight: 700; font-size: .7rem; color: var(--dim); margin-bottom: 3px; }
.bb-studio .st-chapters button:hover { border-color: var(--line-2); color: #fff; }
.bb-studio .st-chapters button i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--amber); transform-origin: left; transform: scaleX(var(--p, 0)); }
.bb-studio .st-chapters li.done button { color: #D4D4D8; }
.bb-studio .st-chapters li.done button b { color: var(--amber); }
.bb-studio .st-chapters li.cur button { border-color: rgba(95, 176, 240, .55); background: rgba(95, 176, 240, .08); color: #fff; }
.bb-studio .st-chapters li.cur button b { color: var(--amber); }
@media (max-width: 1100px) {
  .bb-studio .st-chapters { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .bb-studio .st-chapters::-webkit-scrollbar { display: none; }
  .bb-studio .st-chapters li { flex: 0 0 132px; scroll-snap-align: start; }
}
@media (max-width: 760px) {
  .bb-studio .st-canvas { aspect-ratio: 4/5; max-height: none; }
  .bb-studio .st-info { position: static; width: auto; border-radius: 0; border: 0; border-top: 1px solid var(--line); background: #111113; backdrop-filter: none; padding: 18px 16px; }
  .bb-studio .st-tools { left: 12px; right: 12px; top: 12px; justify-content: space-between; }
  .bb-studio .seg button { padding: 8px 12px; }
  .bb-studio .st-btn { height: 40px; padding: 0 12px; font-size: .85rem; }
  .bb-studio .st-view { right: 12px; bottom: 12px; }
  .bb-studio .st-hint { display: none; }
  .bb-studio .st-rail { padding: 10px; }
  .bb-studio .st-play { width: 46px; }
  .bb-studio .tag span { font-size: .7rem; padding: 5px 8px; }
}

.bb-studio .st-info h3{margin:0;font-family:var(--f-d);font-weight:500}.bb-studio .st-info p{margin:0}
.bb-studio .st-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;z-index:1}
.bb-studio.kz-failed .st-tools,.bb-studio.kz-failed .st-view,.bb-studio.kz-failed .st-hint,.bb-studio.kz-failed .st-rail{display:none}

.coat-studio{position:relative;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse 70% 70% at 55% 40%,#22272c 0%,#121518 55%,#0a0c0e 100%);box-shadow:0 50px 100px -50px rgba(0,0,0,.9)}

const NLD={"PMMA coatings": "PMMA-coatings", "Rapid-cure waterproofing": "Snelhardende waterdichting", "Methyl methacrylate cures in about an hour, even in cold weather. Ideal for balconies, galleries and ramps where residents cannot wait.": "Methylmethacrylaat hardt uit in ongeveer een uur, ook bij koud weer. Ideaal voor balkons, galerijen en hellingbanen waar bewoners niet kunnen wachten.", "PMMA is a liquid waterproofing membrane and a wearing floor in one. It cures in about 60 minutes, resists UV and standing water, and with a fleece reinforcement it bridges cracks in the concrete. It is our standard for balconies, galleries (galerijen) and terraces on VvE projects.": "PMMA is een vloeibare waterdichting en een slijtvaste vloer in één. Het hardt uit in ongeveer 60 minuten, is bestand tegen UV en staand water en overbrugt met een vliesversterking scheuren in het beton. Het is onze standaard voor balkons, galerijen en terrassen bij VvE-projecten.", "Because PMMA cures chemically rather than by evaporation, we can work at substrate temperatures from around 0 °C. Layers go on the same day, so a 40 m gallery is often finished in one or two working days, in sections, so residents always keep access to their front door.": "Omdat PMMA chemisch uithardt en niet door verdamping, kunnen we werken bij een ondergrondtemperatuur vanaf circa 0 °C. Alle lagen gaan dezelfde dag op, dus een galerij van 40 m is vaak in één tot twee werkdagen klaar, in secties, zodat bewoners altijd bij hun voordeur kunnen.", "We finish with a coloured-quartz or flake broadcast and a slip class chosen for the location: R10 on covered galleries, R11–R12 on open balconies and ramps. Details at thresholds, drains and balustrade posts are done in the same material, without joints.": "We werken af met ingestrooid gekleurd kwarts of flakes en een slipklasse die past bij de plek: R10 op overdekte galerijen, R11–R12 op open balkons en hellingbanen. Details bij dorpels, afvoeren en balusterstaanders maken we naadloos in hetzelfde materiaal.", "System thickness": "Systeemdikte", "Cure (20 °C)": "Uitharding (20 °C)", "approx. 60 min": "ca. 60 min", "Foot traffic": "Beloopbaar", "after approx. 2 h": "na ca. 2 uur", "Application temp.": "Verwerkingstemp.", "from approx. 0 °C (substrate)": "vanaf ca. 0 °C (ondergrond)", "UV resistance": "UV-bestendigheid", "yes, non-yellowing": "ja, vergeelt niet", "Crack bridging": "Scheuroverbruggend", "yes (with fleece)": "ja (met vlies)", "Slip resistance": "Slipweerstand", "Balconies and loggias": "Balkons en loggia's", "Galleries and outdoor stairwells (VvE)": "Galerijen en buitentrappenhuizen (VvE)", "Terraces over living space": "Terrassen boven woonruimte", "Ramps and driveways": "Hellingbanen en opritten", "Repairs in low temperatures": "Herstel bij lage temperaturen", "PMMA topcoat, matte": "PMMA-toplaag, mat", "Quartz / flake broadcast": "Kwarts- / flake-instrooiing", "PMMA membrane + fleece": "PMMA-membraan + vlies", "PMMA primer": "PMMA-primer", "Concrete (ground)": "Beton (geschuurd)", "Epoxy floors": "Epoxyvloeren", "Hardness and chemical resistance": "Hardheid en chemische bestendigheid", "Self-levelling or roller-applied epoxy systems for halls, warehouses, workshops and showrooms. Seamless and easy to maintain.": "Zelfnivellerende of gerolde epoxysystemen voor hallen, magazijnen, werkplaatsen en showrooms. Naadloos en onderhoudsvriendelijk.", "Epoxy resin gives a very hard, sealed and chemically resistant surface. We apply it as a rolled coating (0.3–0.5 mm), a quartz-broadcast system or a 2–3 mm self-levelling floor, classified to NEN-EN 13813 as SR.": "Epoxyhars geeft een zeer hard, gesloten en chemisch bestendig oppervlak. We brengen het aan als gerolde coating (0,3–0,5 mm), als ingestrooid kwartssysteem of als zelfnivellerende gietvloer van 2–3 mm, geclassificeerd volgens NEN-EN 13813 als SR.", "Epoxy performs best indoors. Outdoors, and wherever daylight reaches the floor, we seal it with a UV-stable polyurethane topcoat, because epoxy alone yellows over time. Colours come from the RAL range; the floor can get decorative flakes, safety lines and zone markings.": "Epoxy presteert het best binnen. Buiten, en overal waar daglicht op de vloer valt, sluiten we af met een UV-bestendige polyurethaan toplaag, omdat epoxy alleen na verloop van tijd vergeelt. Kleuren kiest u uit het RAL-palet; de vloer kan decoratieve flakes, veiligheidslijnen en zonemarkering krijgen.", "Before pouring we measure concrete moisture by the CM method (max. approx. 4 % for cementitious substrates), pull-off strength (min. 1.5 N/mm²) and the dew point. We do not give a warranty without these measurements, because they decide adhesion.": "Voordat we gieten meten we het vochtgehalte van het beton met de CM-methode (max. ca. 4 % bij cementgebonden ondergronden), de hechttreksterkte (min. 1,5 N/mm²) en het dauwpunt. Zonder deze metingen geven we geen garantie, want zij bepalen de hechting.", "Thickness": "Dikte", "Classification": "Classificatie", "after approx. 24 h": "na ca. 24 uur", "Full load": "Volledig belastbaar", "after approx. 7 days": "na ca. 7 dagen", "Chemical resistance": "Chemische bestendigheid", "very high": "zeer hoog", "needs PU topcoat": "PU-toplaag nodig", "Warehouses and logistics centres": "Magazijnen en distributiecentra", "Production halls": "Productiehallen", "Workshops and garages": "Werkplaatsen en garages", "Showrooms": "Showrooms", "Technical corridors": "Technische gangen", "Sealer coat": "Sealerlaag", "Self-levelling EP layer": "Zelfnivellerende EP-laag", "EP primer + quartz broadcast": "EP-primer + kwartsinstrooiing", "Concrete (diamond ground)": "Beton (diamantgeschuurd)", "Polyurethane systems": "Polyurethaansystemen", "Elasticity and UV stability": "Elasticiteit en UV-bestendigheid", "Elastic, crack-bridging PU coatings for car parks, ramps and balconies, and PU-cement for the food industry.": "Elastische, scheuroverbruggende PU-coatings voor parkeergarages, hellingbanen en balkons, en PU-cement voor de voedingsindustrie.", "Polyurethane moves with the concrete. Where the structure deflects, and where road salt and sunlight act on it, an elastic PU system protects the reinforcement from water and chlorides. We use it on parking decks, ramps and trafficable roofs.": "Polyurethaan beweegt mee met het beton. Waar de constructie doorbuigt en waar strooizout en zonlicht inwerken, beschermt een elastisch PU-systeem de wapening tegen water en chloriden. We passen het toe op parkeerdekken, hellingbanen en beloopbare daken.", "For car parks we build a multi-layer system: epoxy primer, elastic PU membrane, wearing layer with coarse quartz and a UV-stable topcoat. These systems protect concrete in line with NEN-EN 1504-2 and resist tyre marks, oil and salt.": "Voor parkeergarages bouwen we een meerlaags systeem op: epoxyprimer, elastisch PU-membraan, slijtlaag met grof kwarts en een UV-bestendige toplaag. Deze systemen beschermen beton volgens NEN-EN 1504-2 en zijn bestand tegen bandensporen, olie en zout.", "In commercial kitchens and food plants we use PU-cement: 6–9 mm, resistant to thermal shock from hot-water and steam cleaning, to fats and organic acids. We combine it with a coved skirting (holle plint) to meet HACCP requirements.": "In grootkeukens en voedingsbedrijven passen we PU-cement toe: 6–9 mm, bestand tegen thermische schokken bij reiniging met heet water en stoom, tegen vetten en organische zuren. We combineren het met een holle plint, zodat aan de HACCP-eisen wordt voldaan.", "2–4 mm (PU-cement 6–9 mm)": "2–4 mm (PU-cement 6–9 mm)", "yes, elastic system": "ja, elastisch systeem", "yes (aliphatic topcoat)": "ja (alifatische toplaag)", "Vehicle traffic": "Berijdbaar", "after approx. 3–5 days": "na ca. 3–5 dagen", "Concrete protection": "Betonbescherming", "Parking decks and garages": "Parkeerdekken en garages", "Access ramps": "Hellingbanen", "Trafficable roofs and terraces": "Beloopbare daken en terrassen", "Commercial kitchens (PU-cement)": "Grootkeukens (PU-cement)", "Food processing plants": "Voedselverwerkende bedrijven", "UV-stable PU topcoat": "UV-bestendige PU-toplaag", "Wearing layer + coarse quartz": "Slijtlaag + grof kwarts", "Elastic PU membrane": "Elastisch PU-membraan", "EP primer": "EP-primer", "Concrete (shot-blasted)": "Beton (gestraald)", "Troffelvloer": "Troffelvloer", "Trowelled epoxy-quartz screed": "Getroffelde epoxy-kwartsvloer", "The toughest system: 4–8 mm of epoxy-quartz mortar, power-trowelled. For commercial kitchens, production and heavy-duty areas.": "Het zwaarste systeem: 4–8 mm epoxy-kwartsmortel, machinaal getroffeld. Voor grootkeukens, productie en zwaarbelaste ruimtes.", "A troffelvloer is a mortar of epoxy resin and kiln-dried quartz sand, laid 4–8 mm thick and finished with a hand or power trowel. The result is a floor with very high compressive and impact strength, sealed with a closed topcoat.": "Een troffelvloer is een mortel van epoxyhars en gedroogd kwartszand, aangebracht in 4–8 mm en afgewerkt met de hand- of machinetroffel. Het resultaat is een vloer met een zeer hoge druk- en slagvastheid, afgesloten met een dichte toplaag.", "This system is the choice for commercial kitchens, bakeries, meat processing, workshops and halls with forklift traffic. The quartz texture gives R11–R13 slip resistance even on a wet, greasy floor, and the sealer makes daily cleaning easy.": "Dit systeem is de keuze voor grootkeukens, bakkerijen, vleesverwerking, werkplaatsen en hallen met heftruckverkeer. De kwartsstructuur geeft slipklasse R11–R13, ook op een natte, vette vloer, en de sealer maakt dagelijkse reiniging eenvoudig.", "A troffelvloer also lets us form falls to drains and channel gutters without an extra screed. We form coved skirtings (holle plint) from the same mortar, as in the photos from our kitchen project.": "Met een troffelvloer kunnen we ook afschot naar putten en goten maken zonder extra dekvloer. Holle plinten zetten we in dezelfde mortel, zoals op de foto's van ons keukenproject.", "Composition": "Samenstelling", "EP resin + quartz sand": "EP-hars + kwartszand", "Compressive strength": "Druksterkte", "very high (> 60 N/mm², per system)": "zeer hoog (> 60 N/mm², per systeem)", "after approx. 24–48 h": "na ca. 24–48 uur", "Falls to drains": "Afschot naar putten", "yes, in one layer": "ja, in één laag", "Hygiene": "Hygiëne", "seamless, coved skirting, HACCP": "naadloos, holle plint, HACCP", "Commercial kitchens and catering": "Grootkeukens en horeca", "Food production": "Voedselproductie", "Halls with forklift traffic": "Hallen met heftruckverkeer", "Workshops and wash bays": "Werkplaatsen en wasplaatsen", "Wet rooms": "Natte ruimtes", "EP pore sealer": "EP-poriënsealer", "EP + quartz mortar, trowelled": "EP + kwartsmortel, getroffeld", "Concrete (blasted / milled)": "Beton (gestraald / gefreesd)", "Large-format surfaces": "Grote oppervlakken", "Halls · warehouses · kitchens": "Hallen · magazijnen · keukens", "End to end: from grinding and substrate preparation to a finished floor across thousands of m².": "Compleet: van schuren en voorbereiden van de ondergrond tot een afgewerkte vloer over duizenden m².", "A large project is won in substrate preparation. We diamond-grind, shot-blast or mill the concrete, remove old coatings and repair cracks and voids before the system goes down. Always with dust extraction.": "Een groot project wordt gewonnen in de voorbereiding. We schuren het beton met diamant, stralen of frezen het, verwijderen oude coatings en herstellen scheuren en gaten voordat het systeem erop gaat. Altijd met stofafzuiging.", "We work in live buildings: we split the hall into phases, agree night and weekend work windows with the facility manager and hand over zone by zone. Every phase has a record: CM moisture, pull-off strength, temperature and dew point, layer thickness.": "We werken in panden die in gebruik zijn: we delen de hal op in fases, spreken met de facilitair manager nacht- en weekendvensters af en leveren zone voor zone op. Elke fase krijgt een verslag: CM-vocht, hechttreksterkte, temperatuur en dauwpunt, laagdikte.", "We match the system to the load: self-levelling epoxy for warehouses, troffelvloer for kitchens and production, PU-cement where there is hot water and chemicals. We also detail movement joints, safety lines and traffic-route marking.": "We stemmen het systeem af op de belasting: zelfnivellerende epoxy voor magazijnen, troffelvloer voor keukens en productie, PU-cement waar heet water en chemicaliën zijn. Ook dilatatievoegen, veiligheidslijnen en looproutemarkering werken we uit.", "Diamond grinding and shot blasting with dust extraction": "Diamantschuren en kogelstralen met stofafzuiging", "Repair of cracks, voids and joints": "Herstel van scheuren, gaten en voegen", "CM, pull-off and dew-point measurement with a record": "CM-, hechttrek- en dauwpuntmeting met verslag", "Phasing in live buildings": "Gefaseerd werken in panden in gebruik", "Safety lines and zone marking": "Veiligheidslijnen en zonemarkering", "Balconies, terraces and galleries": "Balkons, terrassen en galerijen", "Residential · VvE": "Woningbouw · VvE", "Watertight, slip-resistant PMMA coatings for balconies and galleries. Fast, clean, without long closures.": "Waterdichte, slipvaste PMMA-coatings voor balkons en galerijen. Snel, schoon en zonder lange afsluiting.", "Balconies and galleries in the Netherlands work in rain, frost and sun. Leaks into the flats below and corroded reinforcement are the most common problems VvEs and property managers bring to us. We solve them with seamless PMMA waterproofing finished with coloured quartz.": "Balkons en galerijen in Nederland staan in regen, vorst en zon. Lekkage naar de woningen eronder en gecorrodeerde wapening zijn de meest voorkomende problemen waarmee VvE's en beheerders bij ons komen. We lossen ze op met naadloze PMMA-waterdichting, afgewerkt met gekleurd kwarts.", "On galleries we work in sections and always leave a walkway to front doors. Residents receive a letter with the schedule in advance. PMMA cures in an hour, so even in autumn weather we close a section the same day.": "Op galerijen werken we in secties en laten we altijd een looppad naar de voordeuren vrij. Bewoners krijgen vooraf een brief met de planning. PMMA hardt in een uur uit, dus zelfs bij herfstweer sluiten we een sectie dezelfde dag af.", "Details decide watertightness: balcony door thresholds, balustrade posts, drains, gutters and slab edges. We form them in the same system, reinforced with fleece. Colour separation lines are taped and cut precisely, as in the photos of our projects.": "Details bepalen de waterdichtheid: dorpels van balkondeuren, balusterstaanders, afvoeren, goten en plaatranden. We maken ze in hetzelfde systeem, versterkt met vlies. Kleurscheidingslijnen worden strak afgeplakt en gesneden, zoals op de foto's van onze projecten.", "PMMA waterproofing with fleece": "PMMA-waterdichting met vlies", "Coloured-quartz or flake finish": "Afwerking met gekleurd kwarts of flakes", "Slip resistance R10–R12": "Slipweerstand R10–R12", "Sectional work with door access": "Werken in secties met toegang tot de deur", "Schedule and resident notices": "Planning en bewonersbrieven", "Garages and car parks": "Garages en parkeergarages", "Garages · ramps · car parks": "Garages · hellingbanen · parkeergarages", "Resistant to salt, oil and tyre marks. From a private garage to a multi-storey car park and outdoor ramp.": "Bestand tegen zout, olie en bandensporen. Van een privégarage tot een parkeergarage met meerdere lagen en een buitenhellingbaan.", "Road salt carried in on tyres is the biggest enemy of garage concrete. Chlorides penetrate and corrode the reinforcement. A sealed coating stops them at the surface and protects the structure for years.": "Strooizout dat via de banden binnenkomt is de grootste vijand van garagebeton. Chloriden dringen het beton in en tasten de wapening aan. Een gesloten coating houdt ze aan het oppervlak tegen en beschermt de constructie jarenlang.", "In underground garages we use epoxy systems with quartz broadcast; on open-air decks and ramps, elastic UV-stable PU or PMMA systems. Ramps receive coarser quartz for tyre grip, also in rain.": "In ondergrondse garages gebruiken we epoxysystemen met kwartsinstrooiing; op open parkeerdekken en hellingbanen elastische, UV-bestendige PU- of PMMA-systemen. Hellingbanen krijgen grover kwarts voor grip, ook bij regen.", "We finish with markings: bay lines, direction arrows, pedestrian crossings and protective kerbs, as on the ramp in our project. For private garages we recommend flake epoxy, which looks good and does not absorb oil.": "We werken af met markering: vakbelijning, richtingspijlen, voetgangersoversteken en schrikranden, zoals op de hellingbaan van ons project. Voor privégarages adviseren we epoxy met flakes: dat oogt goed en neemt geen olie op.", "Protection against chlorides and road salt": "Bescherming tegen chloriden en strooizout", "Elastic systems for decks and ramps": "Elastische systemen voor dekken en hellingbanen", "Coarse quartz on ramps (R12–R13)": "Grof kwarts op hellingbanen (R12–R13)", "Lines, arrows and markings": "Belijning, pijlen en markering", "Private garages with flakes": "Privégarages met flakes", "Balcony, PMMA with coloured quartz": "Balkon, PMMA met gekleurd kwarts", "Gallery in progress, colour line": "Galerij in uitvoering, kleurlijn", "Commercial kitchen, troffelvloer": "Grootkeuken, troffelvloer", "Residential gallery after renovation": "Woongalerij na renovatie", "Car park ramp with kerb": "Hellingbaan parkeergarage met schrikrand", "Flakes and coved skirting": "Flakes en holle plint", "Balcony, slip-resistant coating": "Balkon, slipvaste coating", "Garage entrance, markings": "Garage-inrit, markering", "Gallery at front doors": "Galerij bij de voordeuren", "Technical corridor, epoxy": "Technische gang, epoxy", "Inspection & measurement": "Inspectie & meting", "We visit the site, assess the concrete and take measurements. On that basis we prepare a quotation with the chosen system.": "We komen langs, beoordelen het beton en voeren metingen uit. Op basis daarvan maken we een offerte met het gekozen systeem.", "CM moisture": "CM-vocht", "dew point": "dauwpunt", "Substrate preparation": "Voorbereiding ondergrond", "Diamond grinding, shot blasting or milling to an open, sound surface.": "Diamantschuren, kogelstralen of frezen tot een open, draagkrachtig oppervlak.", "old coating removal": "verwijderen oude coatings", "dust extraction": "stofafzuiging", "Repair & primer": "Herstel & primer", "We fill cracks and voids, level and apply a primer matched to the system.": "We vullen scheuren en gaten, egaliseren en brengen een primer aan die past bij het systeem.", "cracks, joints": "scheuren, voegen", "primer + broadcast": "primer + instrooiing", "System application": "Aanbrengen systeem", "We pour and spread base layers, broadcast and topcoat, checking thickness as we go.": "We gieten en verdelen de basislagen, de instrooiing en de toplaag en controleren de laagdikte tijdens het werk.", "thickness control": "laagdiktecontrole", "temp. +3 K above dew point": "temp. +3 K boven dauwpunt", "Handover & warranty": "Oplevering & garantie", "Final check, handover record, maintenance guide and written warranty terms.": "Eindcontrole, opleverrapport, onderhoudsadvies en schriftelijke garantievoorwaarden.", "handover report (opleverrapport)": "opleverrapport", "maintenance advice": "onderhoudsadvies", "Synthetic resin screeds": "Kunstharsgebonden vloeren", "Classification of synthetic resin floors (SR) for bond strength, wear and impact resistance. We describe the performance of our epoxy and troffelvloer systems to this standard.": "Classificatie van kunstharsvloeren (SR) op hechtsterkte, slijtvastheid en slagvastheid. Volgens deze norm beschrijven we de prestaties van onze epoxy- en troffelvloersystemen.", "Surface protection of concrete": "Oppervlaktebescherming van beton", "The standard for systems protecting concrete against water, chlorides and CO₂. It applies to coatings on car parks, balconies and galleries.": "De norm voor systemen die beton beschermen tegen water, chloriden en CO₂. Van toepassing op coatings in parkeergarages, op balkons en galerijen.", "Liquid-applied waterproofing": "Vloeibaar aangebrachte waterdichting", "European technical assessment for liquid membranes such as PMMA on balconies and terraces. We use systems that carry such an approval.": "Europese technische beoordeling voor vloeibare membranen zoals PMMA op balkons en terrassen. We werken met systemen die zo'n goedkeuring hebben.", "Classes R9–R13 describe slip resistance in footwear. We match the class to the zone: kitchen, ramp, balcony, warehouse.": "De klassen R9–R13 beschrijven de slipweerstand met schoeisel. We kiezen de klasse per zone: keuken, hellingbaan, balkon, magazijn.", "Besluit bouwwerken leefomgeving": "Besluit bouwwerken leefomgeving", "Replaced the Bouwbesluit in 2024. We take its safety-in-use requirements into account, for example on galleries and escape routes.": "Vervangt sinds 2024 het Bouwbesluit. We houden rekening met de eisen voor gebruiksveiligheid, bijvoorbeeld op galerijen en vluchtroutes.", "Food-zone hygiene": "Hygiëne in voedselzones", "Seamless floors with coved skirting (holle plint), easy to clean and disinfect, for kitchens and food plants.": "Naadloze vloeren met holle plint, eenvoudig te reinigen en te desinfecteren, voor keukens en voedingsbedrijven.", "Health & safety": "Veiligheid & gezondheid", "We work in line with the Arbowet and VCA rules: protective equipment, ventilation, marked work zones and safe handling of resins.": "We werken volgens de Arbowet en de VCA-regels: beschermingsmiddelen, ventilatie, afgezette werkzones en veilig werken met harsen.", "Measurements": "Metingen", "Quality record": "Kwaliteitsverslag", "CM moisture (cementitious approx. ≤ 4 %), pull-off ≥ 1.5 N/mm², substrate at least 3 K above dew point, air humidity and layer thickness.": "CM-vocht (cementgebonden ca. ≤ 4 %), hechttrek ≥ 1,5 N/mm², ondergrond minimaal 3 K boven het dauwpunt, luchtvochtigheid en laagdikte.", "Which system: PMMA, epoxy or PU?": "Welk systeem: PMMA, epoxy of PU?", "Outdoors and where time matters (balconies, galleries), usually PMMA. Inside halls and warehouses, epoxy. For car parks and structures that move, elastic PU. For kitchens and production, troffelvloer or PU-cement. We make the final choice after on-site measurements.": "Buiten en waar tijd telt (balkons, galerijen) meestal PMMA. In hallen en magazijnen epoxy. Voor parkeergarages en constructies die bewegen elastisch PU. Voor keukens en productie een troffelvloer of PU-cement. De definitieve keuze maken we na metingen op locatie.", "How long does it take?": "Hoe lang duurt het?", "A balcony or gallery section in PMMA: usually one day. A private garage: 2–3 days. A hall of several thousand m²: from a few days to a few weeks, in phases. The exact schedule is in the quotation.": "Een balkon of galerijsectie in PMMA: meestal één dag. Een privégarage: 2–3 dagen. Een hal van enkele duizenden m²: van enkele dagen tot enkele weken, in fases. De exacte planning staat in de offerte.", "Can you work in low temperatures?": "Kunnen jullie werken bij lage temperaturen?", "PMMA yes, from approx. 0 °C substrate temperature. Epoxy and PU usually need at least 10 °C and a substrate at least 3 K above the dew point. We check this with an instrument before every layer.": "PMMA wel, vanaf een ondergrondtemperatuur van ca. 0 °C. Epoxy en PU hebben meestal minimaal 10 °C nodig en een ondergrond die minstens 3 K boven het dauwpunt ligt. We meten dit vóór elke laag.", "Is the work dusty or disruptive?": "Geeft het werk veel stof of overlast?", "We grind and blast with industrial dust extraction, so there is little dust. Resins smell during application, so we provide ventilation and inform building users.": "We schuren en stralen met industriële stofafzuiging, dus er komt weinig stof vrij. Harsen ruiken tijdens het aanbrengen; daarom zorgen we voor ventilatie en informeren we de gebruikers van het gebouw.", "Do you give a warranty?": "Geven jullie garantie?", "Yes. Warranty terms and period are written into the quotation for the specific system and substrate. They are based on the measurement records taken before work.": "Ja. De garantievoorwaarden en -termijn leggen we vast in de offerte, per systeem en ondergrond. Ze zijn gebaseerd op de meetverslagen van vóór de werkzaamheden.", "Do you work for VvEs and property managers?": "Werken jullie voor VvE's en beheerders?", "Yes, it is a large part of our balcony and gallery work. We prepare a quotation the VvE board can follow, a schedule and resident letters.": "Ja, dat is een groot deel van ons werk aan balkons en galerijen. We maken een offerte die het VvE-bestuur goed kan volgen, een planning en bewonersbrieven.", "How do I maintain a resin floor?": "Hoe onderhoud ik een kunstharsvloer?", "Day to day, cleaning with a neutral detergent (pH 7–9) and a soft brush or scrubber is enough. At handover we give a maintenance guide matched to the system.": "Dagelijks reinigen met een neutraal middel (pH 7–9) en een zachte borstel of schrobmachine is voldoende. Bij de oplevering krijgt u een onderhoudsadvies dat past bij het systeem.", "Which region do you cover?": "In welke regio werken jullie?", "The whole of the Netherlands. For large projects also Belgium and Germany by arrangement.": "In heel Nederland. Voor grote projecten in overleg ook in België en Duitsland.", "Free inspection": "Gratis inspectie", "Tell us about your surface. We reply with a plan and a quote.": "Vertel ons over uw oppervlak. U krijgt een plan en een offerte.", "We visit, measure and advise a system. Quotation (offerte) within a few working days.": "We komen langs, meten en adviseren een systeem. Offerte binnen enkele werkdagen.", "Request a quote": "Off  {id:'troffel',code:'TR',img:18,

const BA={p:0,f:0,tw:null,auto:[],io:null};
function baApply(){
 const fr=document.getElementById('baframe');if(!fr)return;const st=BA_ST();
 const p=BA.p,f=BA.f,v=p+f;
 fr.querySelectorAll('img').forEach(im=>{const k=+im.dataset.k;
  if(k===p){im.style.display='block';im.style.zIndex=1;im.style.clipPath='none';}
  else if(k===p+1){im.style.display='block';im.style.zIndex=2;im.style.clipPath=`inset(0 ${((1-f)*100).toFixed(2)}% 0 0)`;}
  else im.style.display='none';});
 const line=document.getElementById('ba-line');line.style.left=(f*100)+'%';line.style.opacity=f>0.005&&f<0.995?1:0;
 const tl=document.getElementById('ba-tl'),tr=document.getElementById('ba-tr');
 tl.textContent=`0${p+2} · ${st[p+1][0]}`;tr.textContent=`0${p+1} · ${st[p][0]}`;
 tl.style.opacity=f>.22?1:0;tr.style.opacity=f<.78?1:0;
 const cur=Math.round(v);document.getElementById('ba-num').textContent='0'+(cur+1);document.getElementById('ba-name').textContent=st[cur][0];
 const r=document.getElementById('ba-range');r.value=Math.round(v*100);r.style.setProperty('--p',(v/3*100)+'%');
 document.querySelectorAll('#ba [data-ba]').forEach(b=>{const k=+b.dataset.ba;b.classList.toggle('on',k===cur);b.classList.toggle('done',k<cur);});
 document.querySelectorAll('#ba .bsteps li').forEach((li,k)=>{const fill=Math.max(0,Math.min(1,v-k+1));li.querySelector('.bp i').style.width=(k===0?100:fill*100)+'%';});
}
function baSetV(v){v=Math.max(0,Math.min(3,v));BA.p=Math.min(2,Math.floor(v));BA.f=v-BA.p;baApply();}
function baStop(){BA.auto.forEach(clearTimeout);BA.auto=[];if(BA.tw)cancelAnimationFrame(BA.tw);BA.tw=null;}
function baGo(to,dur,done){if(BA.tw)cancelAnimationFrame(BA.tw);const from=BA.p+BA.f,t0=performance.now(),e=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
 const step=now=>{const k=Math.min(1,(now-t0)/dur);baSetV(from+(to-from)*e(k));if(k<1)BA.tw=requestAnimationFrame(step);else{BA.tw=null;done&&done();}};BA.tw=requestAnimationFrame(step);}
function baAuto(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;baStop();baSetV(0);const seq=[[1,1400],[2,1400],[3,1400],[2.5,900]];let t=700;
 seq.forEach(([v,d],i)=>{BA.auto.push(setTimeout(()=>baGo(v,d),t));t+=d+(i<2?900:1300);});}
function baInit(){
 const fr=document.getElementById('baframe');if(!fr)return;BA.p=0;BA.f=0;baApply();
 let drag=false;
 const at=e=>{const r=fr.getBoundingClientRect();BA.f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));baApply();};
 fr.addEventListener('pointerdown',e=>{baStop();drag=true;fr.setPointerCapture(e.pointerId);if(BA.f>=.999&&BA.p<2){}at(e);});
 fr.addEventListener('pointermove',e=>{if(drag)at(e);});
 fr.addEventListener('pointerup',()=>drag=false);fr.addEventListener('pointercancel',()=>drag=false);
 const rg=document.getElementById('ba-range');rg.addEventListener('input',()=>{baStop();baSetV(rg.value/100);});
 document.querySelectorAll('#ba [data-ba]').forEach(b=>b.addEventListener('click',()=>{baStop();const k=+b.dataset.ba;baGo(k===0?0:k,900);}));
 fr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){baStop();baSetV(BA.p+BA.f+(e.key==='ArrowRight'?.1:-.1));e.preventDefault();}});
 fr.tabIndex=0;
 if(BA.io)BA.io.disconnect();
 if('IntersectionObserver' in window){BA.io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){BA.io.disconnect();baAuto();}}),{threshold:.45});BA.io.observe(fr);}
}
