function waMessage(){
 const m2=Q.m2?`${Q.m2} m²`:(Q.m2r?nlOf('m2r',Q.m2r):'');
 const lines=['*Nieuwe offerteaanvraag – I&M Bouwwerkers*',''];
 lines.push(`*Soort werk:* ${Q.types.map(k=>catOf(k).nl).join(', ')}`);
 for(const c of Q.types){const qs=QDET[c]||[];const parts=[];
  for(const q of qs){const v=dget(c,q.id,q.multi);const vs=(q.multi?v:[v]).filter(Boolean).map(k=>(q.opts.find(o=>o.k===k)||{}).nl).filter(Boolean);if(vs.length)parts.push(`   – ${q.t[2]}: ${vs.join(', ')}`);}
  const extra=(Q.det[c]||{}).n;if(extra)parts.push(`   – Aantal: ${extra}`);
  if(parts.length){lines.push('',`*${catOf(c).nl}*`,...parts);}}
 lines.push('');
 if(m2)lines.push(`*Oppervlakte:* ${m2}`);
 if(Q.units)lines.push(`*Aantal (ramen/balkons/ruimtes):* ${Q.units}`);
 if(Q.plan)lines.push(`*Gewenste planning:* ${nlOf('plan',Q.plan)}`);
 lines.push('');
 if(Q.client)lines.push(`*Opdrachtgever:* ${nlOf('client',Q.client)}`);
 lines.push(`*Naam:* ${Q.name}`);
 if(Q.company)lines.push(`*Bedrijf / VvE:* ${Q.company}`);
 if(Q.phone)lines.push(`*Telefoon:* ${Q.phone}`);
 if(Q.email)lines.push(`*E-mail:* ${Q.email}`);
 const adr=[Q.street,[Q.pc,Q.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
 if(adr)lines.push(`*Adres project:* ${adr}`);
 lines.push(`*Bij voorkeur contact via:* ${nlOf('pref',Q.pref)}`);
 if(Q.msg.trim()){lines.push('','*Toelichting:*',Q.msg.trim());}
 lines.push('','Foto’s van de situatie stuur ik hierna in deze chat.');
 return lines.join('\n');
}

function wizValidate(){

 if(qStep===3){
  if(!Q.name.trim())return T('Podaj imię i nazwisko.','Enter your name.','Vul uw naam in.');
  if(!Q.phone.trim()&&!/^\S+@\S+\.\S+$/.test(Q.email))return T('Podaj numer telefonu lub poprawny e-mail.','Enter a phone number or a valid e-mail.','Vul een telefoonnummer of een geldig e-mailadres in.');

function wizRead(t){
 if(!t.closest||!t.closest('#qform'))return;
 const g=t.name;if(!g)return;
 if(g.startsWith('d|')){const [,c,id]=g.split('|');Q.det[c]=Q.det[c]||{};const q=(QDET[c]||[]).find(x=>x.id===id);
  if(q&&q.multi){const st=new Set(Q.det[c][id]||[]);t.checked?st.add(t.value):st.delete(t.value);Q.det[c][id]=[...st];}else Q.det[c][id]=t.value;
  if(qErr&&!wizValidate()){qErr='';const e=document.querySelector('.werr');if(e)e.remove();}
  if((t.type==='checkbox'&&t.checked)||t.type==='radio')flyTo(t.closest('label'));else reqUpdate();return;}
 if(t.type==='checkbox'&&Array.isArray(Q[g])){const s=new Set(Q[g]);t.checked?s.add(t.value):s.delete(t.value);Q[g]=[...s];}
 else if(t.type==='checkbox')Q[g]=t.checked;
 else if(t.type==='radio'){Q[g]=t.value;if(g==='m2r'){Q.m2='';const i=document.getElementById('q-m2');if(i)i.value='';}}
 else{Q[g]=t.value;if(g==='m2'&&t.value){Q.m2r='';document.querySelectorAll('input[name="m2r"]').forEach(r=>r.checked=false);}}
 if(qErr&&!wizValidate()){qErr='';const e=document.querySelector('.werr');if(e)e.remove();}
 if((t.type==='checkbox'&&t.checked)||t.type==='radio')flyTo(t.closest('label'));else reqUpdate();
}

function createVoegStudio(host,opts){

 const BW=210,BH=50,SJ=10,LJ=12,MOD=BW+SJ,CRS=BH+LJ,ROWS=9,WW=990,WH=ROWS*CRS-LJ,DX=.42,DY=-.30,DEP=100;
 let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
 const bricks=[],stoots=[],lints=[];
 for(let r=0;r<ROWS;r++){const y=r*CRS,o=r%2?-MOD/2:0;
  for(let k=-1;k<6;k++){const x0=o+k*MOD,x1=x0+BW,a=Math.max(0,x0),b=Math.min(WW,x1);if(b-a>4)bricks.push({x:a,y,w:b-a,h:BH,r});
   const sx=x1;if(sx>0&&sx+SJ<WW)stoots.push({x:sx,y,w:SJ,h:BH,r,v:1});}

 for(let r=0;r*62<h;r++){const y=r*62,o=r%2?-110:0;for(let i=o;i<w;i+=220){x.fillStyle=pal[Math.floor(rnd()*pal.length)];x.fillRect(i,y,210,50);x.fillStyle='rgba(0,0,0,.12)';for(let k=0;k<50;k++)x.fillRect(i+rnd()*210,y+rnd()*50,2,2);}}return c;}
function noiseTex(mk,rnd,w,h,base,n,dark,light,sz){const [c,x]=mk(w,h);x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){x.fillStyle=rnd()<.5?`rgba(0,0,0,${dark*rnd()})`:`rgba(255,255,255,${light*rnd()})`;const s=(sz||2)*(.5+rnd());x.fillRect(rnd()*w,rnd()*h,s,s);}return c;}

const KALK_SCENE={toolScale:1.6,SW:2200,SH:1500,seed:41,tilt:{x:-11,y:4},
 init({rnd,mk}){return {brick:brickTex(mk,rnd,2000,1300),raap:noiseTex(mk,rnd,500,330,'#a6a399',9000,.2,.12,3),fin:noiseTex(mk,rnd,500,330,'#d7d2c6',7000,.08,.12,1.6),
  dots:[...Array(900)].map(()=>[rnd()*2000,rnd()*1200,4+rnd()*9])};},
 draw(c){const {g,t,ch,u,U,N,D,TL,rr,cl,lerp,LB,clock}=c;const X=100,Y=100,WW=2000,WH=1200,OX=110,OY=-70; /* side return depth */
  const sw=k=>Y+WH*k; /* top->bottom sweep */
  /* side return (corner) */
  g.fillStyle='#6e2f1f';g.beginPath();g.moveTo(X+WW,Y);g.lineTo(X+WW+OX,Y+OY);g.lineTo(X+WW+OX,Y+WH+OY);g.lineTo(X+WW,Y+WH);g.closePath();g.fill();g.fillStyle='rgba(0,0,0,.35)';g.fill();
  g.drawImage(D.brick,X,Y,WW,WH);
  /* dirt until brushed */
  if(t<1){g.save();g.beginPath();g.rect(X,ch===0?sw(u):Y,WW,WH);g.clip();g.fillStyle='rgba(60,80,45,.35)';g.fillRect(X,Y,WW,WH);g.restore();}
  /* wetting */
  if(t>=1&&t<4){const k=t<2?u:1;g.fillStyle=`rgba(20,8,4,${.25*(t<3?1:1-U(3))})`;g.fillRect(X,Y,WW,WH*k);}
  /* profiles */

  /* layers */
  const sp=t<3?0:t<4?u:1,rp=t<4?0:t<5?u:1,rei=t<5?0:t<6?u:1,af=t<6?0:t<7?u:1,cure=t<7?0:U(7);
  if(sp>0){g.save();g.beginPath();g.rect(X,Y,WW,WH*sp);g.clip();g.fillStyle='rgba(150,146,136,.55)';g.fillRect(X,Y,WW,WH);D.dots.forEach(d=>{g.fillStyle='#9a968b';g.beginPath();g.arc(X+d[0],Y+d[1],d[2],0,7);g.fill();});
   if(t>=3.6){g.strokeStyle='rgba(60,58,52,.35)';g.lineWidth=3;for(let y=Y+20;y<Y+WH;y+=26){g.beginPath();g.moveTo(X,y);g.lineTo(X+WW,y+Math.sin(y)*4);g.stroke();}}g.restore();}
  if(rp>0){g.save();g.beginPath();g.rect(X,Y,WW*(rp>=1?1:1),WH*rp);g.clip();g.drawImage(D.raap,X,Y,WW,WH);
   /* trowel ridges until ruled off */
   g.save();g.beginPath();g.rect(X+WW*rei,Y,WW,WH);g.clip();g.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<60;i++){g.beginPath();g.ellipse(X+(i*331)%WW,Y+(i*197)%WH,110,26,(i%3-1)*.4,0,7);g.fill();}g.restore();
   if(rei>0){g.strokeStyle='rgba(60,58,52,.28)';g.lineWidth=2.5;g.save();g.beginPath();g.rect(X,Y,WW*rei,WH);g.clip();for(let y=Y+16;y<Y+WH;y+=22){g.beginPath();g.moveTo(X,y);for(let x=X;x<=X+WW;x+=80)g.lineTo(x,y+Math.sin(x*.03+y)*3);g.stroke();}g.restore();}
   g.restore();}
  if(af>0){g.save();g.beginPath();g.rect(X,Y,WW,WH*af);g.clip();g.drawImage(D.fin,X,Y,WW,WH);g.strokeStyle='rgba(0,0,0,.04)';g.lineWidth=3;for(let i=0;i<120;i++){g.beginPath();g.arc(X+(i*173)%WW,Y+(i*89)%WH,40,0,6);g.stroke();}
   const wet=1-cl(cure*1.2);g.fillStyle=`rgba(60,58,52,${.25*wet})`;g.fillRect(X,Y,WW,WH);g.restore();}
  if(t>=N){g.drawImage(D.fin,X,Y,WW,WH);}
  /* profile lines on top */
  if(pk>0){g.fillStyle='#d9dde1';g.fillRect(X+WW-14,Y,14,WH*Math.min(1,pk*2));if(pk>.5){g.fillRect(X,Y+WH-14,WW*cl((pk-.5)*2),14);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(X,Y+WH,WW*cl((pk-.5)*2),6);}}
  /* foil */
  if(cure>0){const k=Math.min(1,cure*2.5)*(cure>.85?1-(cure-.85)/.15:1);if(k>0){g.fillStyle=`rgba(220,235,250,${.4*k})`;g.fillRect(X-30,Y-30,WW+60,(WH+60)*Math.min(1,k*1.3));g.strokeStyle=`rgba(255,255,255,${.35*k})`;g.lineWidth=3;for(let x=X;x<X+WW;x+=180){g.beginPath();g.moveTo(x,Y-30);g.lineTo(x+20,Y+WH);g.stroke();}}}
  let tp=null,tool=null,lab=null,emit=null;const zx=()=>X+WW/2+Math.sin(clock*2.4)*WW*.42;

 init({rnd,mk}){const [blk,b]=mk(1900,1300);b.fillStyle='#c9c6be';b.fillRect(0,0,1900,1300);for(let r=0;r*250<1300;r++){const o=r%2?-450:0;for(let x=o;x<1900;x+=900){b.fillStyle=`rgb(${205+rnd()*14|0},${202+rnd()*14|0},${194+rnd()*12|0})`;b.fillRect(x+3,r*250+3,894,244);for(let k=0;k<200;k++){b.fillStyle='rgba(0,0,0,.06)';b.fillRect(x+rnd()*894,r*250+rnd()*244,2,2);}}}

 draw(c){const {g,t,ch,u,U,N,D,TL,rr,cl,lerp,LB,clock}=c;const X=150,Y=120,WW=1900,WH=1300,RX=160,RY=-90; /* return wall at right = outside corner */

  let tp=null,tool=null,lab=null,emit=null;const zx=()=>X+WW/2+Math.sin(clock*2.2)*WW*.42,sw=k=>Y+WH*k;

/* ---------- smooth inertia scroll (Lenis-style) ---------- */
const SS={y:scrollY,t:scrollY,on:false};
const ssMax=()=>Math.max(0,document.documentElement.scrollHeight-innerHeight);
function ssStop(){SS.on=false;SS.y=SS.t=scrollY;}
if(FINE&&!RM){
 addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  if(e.target.closest&&e.target.closest('textarea,select,.mnav,.lb,.mega,.victory,#intro'))return;
  e.preventDefault();
  if(!SS.on){SS.y=scrollY;SS.t=scrollY;}
  const k=e.deltaMode===1?40:e.deltaMode===2?innerHeight:1;
  SS.t=clamp(SS.t+e.deltaY*k,0,ssMax());SS.on=true;
 },{passive:false});

}
function ssStep(){if(!SS.on)return;SS.y+=(SS.t-SS.y)*.1;if(Math.abs(SS.t-SS.y)<.5){SS.y=SS.t;SS.on=false;}scrollTo(0,SS.y);}

/* ---------- split text (kinetic typography) ---------- */
function splitText(el,mode){
 if(el.dataset.split)return;el.dataset.split='1';let i=0;
 const walk=(node,inGt)=>{[...node.childNodes].forEach(ch=>{
  if(ch.nodeType===3){const frag=document.createDocumentFragment();
   ch.textContent.split(/(\s+)/).forEach(pt=>{if(!pt)return;if(/^\s+$/.test(pt)){frag.appendChild(document.createTextNode(' '));return;}
    const w=document.createElement('span');w.className='sw';
    if(mode==='chars'&&!inGt){[...pt].forEach(c=>{const s=document.createElement('span');s.className='sc';s.textContent=c;s.style.setProperty('--i',i++);w.appendChild(s);});}
    else{const s=document.createElement('span');s.className='sc'+(inGt?' gt':'');s.textContent=pt;s.style.setProperty('--i',i);i+=mode==='chars'?Math.max(2,pt.length*.6|0):1;w.appendChild(s);}
    frag.appendChild(w);});
   ch.replaceWith(frag);}
  else if(ch.nodeType===1&&ch.tagName!=='BR'){const g=ch.classList.contains('gt');if(g)ch.classList.remove('gt');walk(ch,inGt||g);}
 });};
 walk(el,false);el.classList.add('kt',mode==='chars'?'kt-c':'kt-w');
}

/* ---------- WebGL smoke shader ---------- */
function smokeGL(cv,o){
 let gl;try{gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});}catch(e){}
 if(!gl)return null;
 const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 const fs=`precision mediump float;uniform vec2 r;uniform float t;uniform vec3 c1;uniform vec3 c2;uniform float a;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
 float fbm(vec2 p){float v=0.,s=.5;for(int i=0;i<5;i++){v+=s*n(p);p=p*2.03+vec2(1.7,9.2);s*=.5;}return v;}
 void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*2.4;
  vec2 q=vec2(fbm(p+vec2(0.,t*.045)),fbm(p+vec2(5.2,1.3)-t*.035));
  vec2 w=vec2(fbm(p+3.*q+vec2(1.7,9.2)+t*.02),fbm(p+3.*q+vec2(8.3,2.8)-t*.025));
  float f=fbm(p+2.6*w);
  vec3 col=mix(c1,c2,smoothstep(.45,1.,f+.15*w.x));
  float al=smoothstep(.32,.95,f)*a*(.45+.55*uv.y);
  gl_FragColor=vec4(col*al,al);}`;
 const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;
 gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const U=k=>gl.getUniformLocation(pr,k);const ur=U('r'),ut=U('t');
 gl.uniform3fv(U('c1'),o.c1);gl.uniform3fv(U('c2'),o.c2);gl.uniform1f(U('a'),o.a);
 let raf=0,on=false;const t0=performance.now()-Math.random()*20000;
 const size=()=>{const rc=cv.getBoundingClientRect(),q=.45*Math.min(2,devicePixelRatio||1);cv.width=Math.max(2,rc.width*q|0);cv.height=Math.max(2,rc.height*q|0);gl.viewport(0,0,cv.width,cv.height);};
 const draw=now=>{gl.uniform2f(ur,cv.width,cv.height);gl.uniform1f(ut,(now-t0)/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
 const loop=now=>{if(!on||!cv.isConnected){on=false;return;}raf=requestAnimationFrame(loop);draw(now);};
 return{start(){if(on)return;size();if(RM){draw(performance.now());return;}on=true;raf=requestAnimationFrame(loop);},stop(){on=false;cancelAnimationFrame(raf);},size};
}

/* ---------- dust particles in the light beams ---------- */
function dustFX(cv){
 const g=cv.getContext('2d');let W=0,H=0,P=[],on=false,raf=0;
 const size=()=>{const rc=cv.getBoundingClientRect();W=cv.width=rc.width|0;H=cv.height=rc.height|0;P=Array.from({length:Math.min(140,Math.round(W*H/8000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.7,v:5+Math.random()*16,ph:Math.random()*6.28}));};
 const beams=[.5,.66,.82];
 const fr=now=>{if(!on||!cv.isConnected){on=false;return;}raf=requestAnimationFrame(fr);g.clearRect(0,0,W,H);const t=now/1000;
  for(const p of P){p.y-=p.v*.016;p.x+=Math.sin(t*.5+p.ph)*.22;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
   const fy=1-p.y/H;let bm=0;for(const b of beams){const cx=b+(fy-.5)*.06,wd=.03+.09*(1-fy);bm=Math.max(bm,1-Math.abs(p.x/W-cx)/wd);}
   const fl=.4+.6*Math.abs(Math.sin(t*1.2+p.ph));g.globalAlpha=Math.min(1,(.08+Math.max(0,bm)*.75)*fl);g.fillStyle='#d9eeff';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();}};
 return{start(){if(on||RM)return;size();on=true;raf=requestAnimationFrame(fr);},stop(){on=false;cancelAnimationFrame(raf);},size};
}

/* ---------- confetti (resin flakes) ---------- */
function confetti(x,y,n){
 if(RM)return;n=n||150;let cv=document.getElementById('confetti');
 if(!cv){cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);}
 const dpr=Math.min(2,devicePixelRatio||1);if(!FX.confOn){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;}
 const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
 const pal=['#f3f2ef','#17181a','#8a8e91','#5fb0f0','#2f8ad6','#5a5e61','#d6d8d9'];const P=FX.conf||(FX.conf=[]);
 for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25,s=280+Math.random()*760;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*6.28,vr:(Math.random()-.5)*14,s:2.5+Math.random()*5.5,c:pal[i%pal.length],k:5+(i%4),life:0});}
 if(FX.confOn)return;FX.confOn=true;let last=performance.now();
 const fr=now=>{const dt=Math.min(.04,(now-last)/1000);last=now;g.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=1250*dt;p.vx*=.986;p.vy*=.986;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life+=dt;
   if(p.y>innerHeight+40||p.life>4.5){P.splice(i,1);continue;}
   g.save();g.translate(p.x,p.y);g.rotate(p.r);g.scale(1,Math.cos(p.life*7+p.vr));g.fillStyle=p.c;g.beginPath();
   for(let j=0;j<p.k;j++){const a=j/p.k*6.283;g.lineTo(Math.cos(a)*p.s,Math.sin(a)*p.s*.85);}g.closePath();g.fill();g.restore();}
  if(P.length)requestAnimationFrame(fr);else{FX.confOn=false;g.clearRect(0,0,innerWidth,innerHeight);}};
 requestAnimationFrame(fr);
}

function reqCount(){let d=0;for(const c in Q.det)for(const k in Q.det[c]){const v=Q.det[c][k];d+=Array.isArray(v)?v.length:(v?1:0);}return Q.types.length+d+[Q.m2r||Q.m2,Q.units,Q.plan,Q.client].filter(Boolean).length;}
function reqUpdate(){const p=document.getElementById('reqpill');if(!p)return;const b=p.querySelector('.rp-n');rollSet(b,reqCount());}

 const a=src.getBoundingClientRect(),b=pill.getBoundingClientRect();
 const d=document.createElement('span');d.className='flychip';d.textContent=(src.querySelector('b')||src).textContent.trim().slice(0,22);

 const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
 const bump=()=>{d.remove();reqUpdate();pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');};

}

  if(ph!==last){last=ph;document.querySelectorAll('#phase li').forEach(s=>{s.classList.toggle('on',+s.dataset.p===ph);s.classList.toggle('done',+s.dataset.p<ph);});}
 }
 addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
 return{
  mount(container){if(!container)return;try{if(!root)build();}catch(e){return;}
   el=container;el.appendChild(root);const fb=el.parentNode.querySelector('.hero-fallback');if(fb)fb.style.display='none';last=-1;
   if(!raf)raf=requestAnimationFrame(frame);},
  unmount(){if(raf)cancelAnimationFrame(raf);raf=null;el=null;}
 };
})();

document.addEventListener('visibilitychange',()=>{if(document.hidden)Hero.unmount();else if(current()==='home')Hero.mount(document.getElementById('hero3d'));else if(current()==='vaardigheden')Hero.mount(document.getElementById('sk-coat3d'));});
FX.init();
intro(()=>{if(FX.heroWait){FX.heroWait();FX.heroWait=null;}});
render(false);
})();
